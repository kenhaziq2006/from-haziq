<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday someone ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Loading Screen -->

<div class="loading">

    <h1>Preparing Something Special...</h1>

</div>



<!-- Floating Hearts -->

<div id="hearts"></div>



<!-- Music -->

<audio id="bgMusic" loop>

    <source src="my love.mp3" type="audio/mpeg">

</audio>


<!-- Music Button (tukar gambar nanti dekat sini) -->

<img id="musicBtn" src="music.png" alt="Music Button">



<!-- Main Card -->

<div class="container">


<div class="card">


<h2>
🎂 Happy Birthday 🎂
</h2>


<h1>
someone ❤️
</h1>



<img src="cake.gif" class="cake">



<p>

I have something special prepared just for you.

It may not be the biggest surprise in the world,

but every little detail here was made with you in mind.


<br><br>


Would you like to see it?

</p>



<div class="buttons">


<button id="yesBtn">

YES 💖

</button>



<button id="noBtn">

NO 🙈

</button>



</div>


</div>


</div>



<script src="script.js"></script>


</body>

</html>
